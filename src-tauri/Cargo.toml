[package]
name = "dsh-desktop-shell"
version = "0.1.0"
description = "DeepSeek Harness desktop render client: opens the dsh desktop profile's web surface in a native window."
edition = "2021"

# The render client is intentionally thin: it receives the served URL from the
# desktop profile's desktop-shell plugin (`dsh-desktop-shell <url>`) and opens
# a WebView window on it. It spawns nothing and owns no harness logic — the
# profile (`dsh --profile desktop`) is the entry point, this binary is just the
# native window surface.
[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Local patch: tao unconditionally installs its own GtkHeaderBar (CSD
# titlebar) on every Wayland window, forcing a GNOME-style header even on
# tiling compositors like driftwm whose SSD mode already provides the chrome.
# The patch removes that forced header entirely, so GTK3 negotiates
# xdg-decoration with the compositor and the environment decides: SSD (no
# titlebar) on driftwm, a normal titlebar on GNOME/KDE. See
# vendor/tao/README.dsh-patch.
[patch.crates-io]
tao = { path = "vendor/tao" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
