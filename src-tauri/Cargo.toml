[package]
name = "dsh-desktop-shell"
version = "0.2.3"
description = "DeepSeek Harness desktop render client: opens the dsh desktop profile's web surface in a native window."
edition = "2021"
authors = ["s3yf1337 <s3yf1337@users.noreply.github.com>"]

# The render client is intentionally thin: it receives the served URL from the
# desktop profile's desktop-shell plugin (`dsh-desktop-shell <url>`) and opens
# a WebView window on it. It spawns nothing and owns no harness logic — the
# profile (`dsh --profile desktop`) is the entry point, this binary is just the
# native window surface.
#
# Desktop features live here, in the shell: the tray icon (close-to-tray),
# single-instance handling, window geometry persistence, native OS
# notifications, and the GitHub release updater that *suggests* updates
# without ever forcing them. The web surface's "dsh-desktop" settings tab
# drives all of it through the `desktop_*` commands.
[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# SHA-256 verification of downloaded update archives (locked 0.17.14, already
# in Cargo.lock transitively through rustls so the build resolves offline).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Clipboard image paste for the webview: WebKitGTK does not expose clipboard
# images through DOM paste events, so the shell reads them natively (arboard)
# and encodes RGBA → PNG (png) for the browser half.
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
png = "0.17"
# GitHub releases API client (HTTPS via rustls + ring; no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = { version = "1", features = ["serde"] }
# Open the browser on the release page ("suggest update" is the whole point).
open = "5"
trash = "5"
# Periodic updater sleeps + update download/apply (tauri's async runtime is
# tokio underneath).
tokio = { version = "1", features = ["time", "fs", "io-util"] }
# One-click update: the release ships a per-platform tar.gz (client binary +
# plugin bundle); these extract it.
flate2 = "1"
tar = "0.4"
# Stream helper for the update download (reqwest's `bytes_stream`).
futures-util = "0.3"

# Local patch: tao unconditionally installs its own GtkHeaderBar (CSD
# titlebar) on every Wayland window, forcing a GNOME-style header even on
# tiling compositors like driftwm whose SSD mode already provides the chrome.
# The patch removes that forced header entirely, so GTK3 negotiates
# xdg-decoration with the compositor and the environment decides: SSD (no
# titlebar) on driftwm, a normal titlebar on GNOME/KDE. See
# vendor/tao/README.dsh-patch.
[patch.crates-io]
tao = { path = "vendor/tao" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Set the GTK application name so the system tray (libappindicator) shows
# "DeepSeek Harness" instead of the binary name on hover. Linux-only: glib is
# a GTK binding and does not build on Windows/macOS (the tray title there
# comes from other channels). `gtk`/`gio` hold the GtkApplication so hiding
# the last window does not unregister the StatusNotifierItem.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gio = "0.18"
gtk = "0.18"

# localtime_r for the tray's "finished at HH:MM" (the comment promised local
# time; a UTC remainder is wrong for anyone not on UTC).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
