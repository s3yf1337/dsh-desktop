name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            slug: linux-x86_64
            bundles: deb
          - os: macos-latest
            slug: macos-aarch64
            bundles: app,dmg
          - os: windows-latest
            slug: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Install tauri-cli (prebuilt, fast)
        run: npm install -g @tauri-apps/cli@^2

      - name: Build + bundle (${{ matrix.bundles }})
        working-directory: src-tauri
        run: tauri build --bundles ${{ matrix.bundles }}

      # The update tarball: the raw client binary + the plugin bundle, named
      # dsh-desktop-<tag>-<slug>.tar.gz so the app's one-click updater can
      # find its platform package among the release assets.
      - name: Pack the update tarball
        shell: bash
        run: |
          BIN=dsh-desktop-shell
          [ "$RUNNER_OS" = "Windows" ] && BIN=dsh-desktop-shell.exe
          tar -czf "dsh-desktop-${GITHUB_REF_NAME}-${{ matrix.slug }}.tar.gz" \
            -C src-tauri/target/release "$BIN" \
            -C ../../../ bundle

      # Produce the `<tarball>.sha256` checksum the updater verifies before
      # applying an update. sha256sum ships with Git Bash on Windows too.
      - name: Sha256 the update tarball
        shell: bash
        run: |
          TARBALL="dsh-desktop-${GITHUB_REF_NAME}-${{ matrix.slug }}.tar.gz"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            dsh-desktop-*.tar.gz
            dsh-desktop-*.sha256

  # Publish exactly one release from one job: this job downloads the per-OS
  # installers + update tarballs and creates the GitHub release. dsh-desktop
  # is a harness profile/plugin, so a release ships both the OS installers
  # (which install the plugin into dsh) and the raw tarballs the in-app
  # one-click updater consumes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Only the real deliverables: installers, update tarballs and their
          # checksums. The build artifact also carries bundle staging files
          # (icon.icns, Info.plist, control, data.tar.gz, …) whose names
          # collide across platforms; publishing them trips softprops' asset
          # label update (duplicate names → "Not Found") and litters the
          # release page with internals.
          files: |
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/dsh-desktop-*.tar.gz
            artifacts/**/dsh-desktop-*.sha256
          generate_release_notes: true
