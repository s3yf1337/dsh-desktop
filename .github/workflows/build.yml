name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: dsh-desktop-shell-linux-x86_64
          - os: macos-latest
            bin: dsh-desktop-shell-macos-aarch64
          - os: windows-latest
            bin: dsh-desktop-shell-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Build client (cargo build --release)
        working-directory: src-tauri
        run: cargo build --release

      - name: Name the client binary per OS
        shell: bash
        run: |
          cd src-tauri/target/release
          if [ -f dsh-desktop-shell.exe ]; then
            mv dsh-desktop-shell.exe "${{ matrix.bin }}"
          else
            mv dsh-desktop-shell "${{ matrix.bin }}"
          fi

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          if-no-files-found: error
          path: src-tauri/target/release/${{ matrix.bin }}

  # Publish exactly one release from one job: the build matrix only uploads
  # binaries; this job downloads them, packs the plugin bundle, and creates
  # the GitHub release (dsh-desktop is a harness profile/plugin — the client
  # binary + the bundle are the artifacts, not OS installers).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pack the plugin bundle
        run: tar -czf dsh-desktop-shell-bundle-${GITHUB_REF_NAME}.tgz bundle/

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            dsh-desktop-shell-bundle-*.tgz
          generate_release_notes: true
